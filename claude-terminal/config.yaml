---
name: "Claude Agent"
description: "Runs Anthropic's Claude Code 24/7 with persistent login. Reach it via the web terminal, SSH, Remote Control (/rc) on the Claude mobile app, or a Telegram channel; connects to the Home Assistant MCP server."
version: "2.2.4"
slug: "claude_agent"
init: false

# Supported architectures
arch:
  - aarch64
  - amd64
  - armv7

# External resources
url: "https://github.com/marcjay/claude-code-ha"

# Web interface configuration
ingress: true
ingress_port: 7680
panel_icon: mdi:robot-happy-outline
panel_title: "Claude Agent"
panel_admin: true

# Port configuration
ports:
  7680/tcp: 7680
  7681/tcp: 7681
  22/tcp: null
ports_description:
  7680/tcp: "Image upload service and web interface"
  7681/tcp: "ttyd terminal (embedded in web interface)"
  22/tcp: "SSH access (only used when enable_ssh is true; map to a free host port, e.g. 2222)"

# Add-on configuration options
options:
  auto_launch_claude: true
  tmux_mouse: false
  dangerously_skip_permissions: false
  persistent_apk_packages: []
  persistent_pip_packages: []
  use_persistent_claude: false
  auto_update_claude_on_start: false
  claude_extra_args: ""
  enable_ha_mcp: true
  ha_mcp_url: ""
  enable_ssh: false
  ssh_password: ""
  ssh_authorized_keys: []
  enable_telegram: false
  telegram_bot_token: ""

schema:
  auto_launch_claude: bool?
  tmux_mouse: bool?
  dangerously_skip_permissions: bool?
  persistent_apk_packages:
    - str?
  persistent_pip_packages:
    - str?
  use_persistent_claude: bool?
  auto_update_claude_on_start: bool?
  claude_extra_args: str?
  enable_ha_mcp: bool?
  ha_mcp_url: str?
  enable_ssh: bool?
  ssh_password: password?
  ssh_authorized_keys:
    - str?
  enable_telegram: bool?
  telegram_bot_token: password?

# Volume mappings for file access
map:
  - config:rw            # Home Assistant configuration files
  - all_addon_configs:rw # Other add-ons' config dirs (edit their YAML)
  - share:rw             # /share (browse output over Samba)

# API access for Home Assistant integration
hassio_api: true
hassio_role: manager
homeassistant_api: true
auth_api: true

# Service startup configuration
startup: services

# Web UI access URL
webui: http://[HOST]:[PORT:7680]/
